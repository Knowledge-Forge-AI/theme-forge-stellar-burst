schema = "tfsb.brand-qa"
schema_version = 1

[[profiles]]
id = "terminal-nova-release"
renderer = "required"
formats = ["json", "markdown", "html"]
cases = [
  "family-completeness",
  "external-content",
  "favicon-small-size",
  "mark-clear-space",
  "horizontal-minimum",
  "stacked-minimum",
  "favicon-baseline-light"
]

[[cases]]
id = "family-completeness"
kind = "inventory"
family = "terminal-nova"

[[cases]]
id = "external-content"
