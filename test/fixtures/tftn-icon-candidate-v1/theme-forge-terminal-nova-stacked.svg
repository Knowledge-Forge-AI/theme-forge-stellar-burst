                    x1="92"
                    y1="88"
                    x2="166"
                    y2="172"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#FF8A3D"/>
      <stop offset="0.52" stop-color="#E45A9E"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>

    <g id="tn-stacked-mark">
