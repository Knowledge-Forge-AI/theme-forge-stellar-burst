<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg"
     width="600"
     height="560"
     viewBox="0 0 600 560"
     role="img"
     aria-labelledby="tn-stacked-title tn-stacked-desc"
     shape-rendering="geometricPrecision">
  <title id="tn-stacked-title">Theme Forge Terminal Nova stacked lockup</title>
  <desc id="tn-stacked-desc">
    Stacked production lockup with the six-facet Terminal Nova mark,
    Theme Forge endorsement, and Terminal Nova wordmark.
  </desc>

  <metadata>
    Brand: Theme Forge / Terminal Nova
    Asset: Stacked production lockup
    Version: 1.0
    Background: Transparent
    Lettering source before conversion: Terminal Nova Grid 1.0,
    custom geometric uppercase lettering.
    Lettering license: CC0 1.0 Universal,
    https://creativecommons.org/publicdomain/zero/1.0/
    All lettering is represented by internal SVG path geometry.
    No font program is embedded or referenced.
    No raster images, external CSS, or JavaScript.
  </metadata>

  <defs>
