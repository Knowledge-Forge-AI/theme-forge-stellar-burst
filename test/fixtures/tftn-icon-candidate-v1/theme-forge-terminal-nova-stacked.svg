    <path id="glyph-H" d="M0 0V12M8 0V12M0 6H8"/>
    <path id="glyph-E" d="M8 0H0V12H8M0 6H6.5"/>
    <path id="glyph-M" d="M0 12V0L4 5L8 0V12"/>
