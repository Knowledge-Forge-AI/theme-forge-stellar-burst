      <path fill="#282A31" d="M225 77L225 180L178 156L178 100Z"/>
      <path fill="#302844" d="M221 186L132 238L132 188L175 163Z"/>
      <path fill="#35273F" d="M124 238L35 186L81 163L124 188Z"/>
