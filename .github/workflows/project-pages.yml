name: Deploy project website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - '.github/workflows/project-pages.yml'
  workflow_dispatch:

permissions: {}

concurrency:
  group: project-website-pages
  cancel-in-progress: false

jobs:
  stage-website:
    if: ${{ github.repository == 'Knowledge-Forge-AI/theme-forge-stellar-burst' && github.ref == 'refs/heads/main' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Check out the website source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Stage only the static website files
        shell: bash
        run: |
          set -euo pipefail
          tar --directory website -cf "$RUNNER_TEMP/artifact.tar" index.html styles.css main.js robots.txt CNAME orihime.webp
      - name: Upload the website transport
        uses: actions/upload-artifact@b4b15b8c7c6ac21ea08fcf65892d2ee8f75cf882 # v4.4.3
        with:
          name: github-pages
          path: ${{ runner.temp }}/artifact.tar
          retention-days: 1
          if-no-files-found: error

  deploy-website:
    if: ${{ github.repository == 'Knowledge-Forge-AI/theme-forge-stellar-burst' && github.ref == 'refs/heads/main' }}
    needs: stage-website
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy the project website
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
